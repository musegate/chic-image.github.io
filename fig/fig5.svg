<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="900" viewBox="0 0 1650 900" role="img" aria-labelledby="title desc">
  <title id="title">Qwen Prompt Enhancement Model Workflow</title>
  <desc id="desc">Short prompts are enhanced by the Qwen large language model into a structured long prompt and skeletal pose-control information for Chic-Image image generation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6fbff"/>
      <stop offset="0.52" stop-color="#f9f5ff"/>
      <stop offset="1" stop-color="#fff8ed"/>
    </linearGradient>
    <linearGradient id="qwen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b3cc4"/>
      <stop offset="1" stop-color="#1f8db5"/>
    </linearGradient>
    <linearGradient id="output" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8968"/>
      <stop offset="1" stop-color="#f5b742"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#27375f" flood-opacity=".14"/>
    </filter>
    <marker id="arrow" markerWidth="20" markerHeight="20" viewBox="0 0 10 10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#52617b"/>
    </marker>
    <marker id="arrowBlue" markerWidth="20" markerHeight="20" viewBox="0 0 10 10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#397fc5"/>
    </marker>
    <marker id="arrowOrange" markerWidth="20" markerHeight="20" viewBox="0 0 10 10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#e8903b"/>
    </marker>
    <marker id="arrowTeal" markerWidth="20" markerHeight="20" viewBox="0 0 10 10" refX="10" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2a9d98"/>
    </marker>
    <filter id="lineGlow" x="-20%" y="-80%" width="140%" height="260%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#4d668e" flood-opacity=".18"/>
    </filter>
    <style>
      .cn { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 42px; font-weight: 800; fill: #17213d; letter-spacing: 1px; }
      .subtitle { font-size: 19px; fill: #69738a; }
      .section { font-size: 20px; font-weight: 800; fill: #263552; }
      .body { font-size: 19px; fill: #32415d; }
      .small { font-size: 16px; fill: #67748d; }
      .white { fill: #fff; }
    </style>
  </defs>

  <rect width="1650" height="900" fill="url(#bg)"/>
  <circle cx="93" cy="92" r="150" fill="#dff4ff" opacity=".58"/>
  <circle cx="1490" cy="780" r="220" fill="#ffe7bd" opacity=".44"/>
  <circle cx="1410" cy="85" r="96" fill="#eadfff" opacity=".56"/>

  <g filter="url(#shadow)">
    <rect x="80" y="200" width="340" height="470" rx="28" fill="#fff"/>
    <rect x="565" y="170" width="350" height="530" rx="34" fill="url(#qwen)"/>
    <rect x="1045" y="185" width="255" height="250" rx="28" fill="#fff"/>
    <rect x="1045" y="465" width="255" height="250" rx="28" fill="#fff"/>
    <rect x="1380" y="335" width="245" height="230" rx="30" fill="url(#output)"/>
  </g>

  <!-- Clean, short curve connectors keep the two generation controls visually separate. -->
  <g filter="url(#lineGlow)">
    <path d="M420 435 H565" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <path d="M420 435 H565" fill="none" stroke="#397fc5" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowBlue)"/>
    <path d="M915 350 C960 350 990 310 1045 310" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <path d="M915 350 C960 350 990 310 1045 310" fill="none" stroke="#e8903b" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowOrange)"/>
    <path d="M915 530 C960 530 990 590 1045 590" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <path d="M915 530 C960 530 990 590 1045 590" fill="none" stroke="#2a9d98" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowTeal)"/>
    <path d="M1300 310 C1330 310 1335 405 1360 405" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <path d="M1300 310 C1330 310 1335 405 1360 405" fill="none" stroke="#e8903b" stroke-width="4" stroke-linecap="round"/>
    <path d="M1300 590 C1330 590 1335 495 1360 495" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
    <path d="M1300 590 C1330 590 1335 495 1360 495" fill="none" stroke="#2a9d98" stroke-width="4" stroke-linecap="round"/>
    <path d="M1360 394 L1380 405 L1360 416 Z" fill="#e8903b"/>
    <path d="M1360 484 L1380 495 L1360 506 Z" fill="#2a9d98"/>
    <circle cx="915" cy="350" r="5" fill="#e8903b" stroke="#fff" stroke-width="2"/>
    <circle cx="915" cy="530" r="5" fill="#2a9d98" stroke="#fff" stroke-width="2"/>
  </g>
  <g class="cn" font-size="15" font-weight="700">
    <rect x="474" y="390" width="86" height="30" rx="15" fill="#e5f1ff"/>
    <text x="517" y="402" text-anchor="middle" font-size="10" fill="#397fc5"><tspan x="517" dy="0">Semantic</tspan><tspan x="517" dy="11">understanding</tspan></text>
  </g>

  <!-- Input card -->
  <g class="cn">
    <rect x="106" y="228" width="94" height="38" rx="19" fill="#ddf4fa"/>
    <text x="153" y="254" text-anchor="middle" font-size="17" font-weight="700" fill="#19829a">INPUT</text>
    <text x="112" y="314" class="section">Short T2I prompts</text>
    <rect x="112" y="344" width="275" height="116" rx="17" fill="#f3f7fc"/>
    <text x="136" y="384" class="body" font-weight="700">&quot;Girl in a white dress&quot;</text>
    <text x="136" y="419" class="body">&quot;Portrait in an autumn cafe&quot;</text>
    <text x="112" y="510" class="small">Low description burden</text>
    <path d="M112 541 H386" stroke="#e5eaf2" stroke-width="2"/>
    <text x="112" y="584" class="body" font-weight="700">Preserve core intent</text>
    <text x="112" y="620" class="small">Subject · style · scene preferences</text>
  </g>

  <!-- Qwen core -->
  <g class="cn white" transform="translate(-60 0)">
    <rect x="651" y="198" width="112" height="38" rx="19" fill="#ffffff" opacity=".2"/>
    <text x="707" y="224" text-anchor="middle" font-size="17" font-weight="800">QWEN LLM</text>
    <text x="800" y="302" text-anchor="middle" font-size="25" font-weight="800">Prompt Enhancement Model</text>
    <text x="800" y="329" text-anchor="middle" font-size="11" opacity=".88">Supervised fine-tuning · instruction following</text>
    <text x="800" y="347" text-anchor="middle" font-size="11" opacity=".88">Controllable style</text>
    <rect x="666" y="382" width="268" height="55" rx="15" fill="#ffffff" opacity=".16"/>
    <text x="800" y="417" text-anchor="middle" font-size="14" font-weight="700">Semantic completion &amp; attribute expansion</text>
    <rect x="666" y="456" width="268" height="55" rx="15" fill="#ffffff" opacity=".16"/>
    <text x="800" y="491" text-anchor="middle" font-size="15" font-weight="700">Structured field organization</text>
    <rect x="666" y="530" width="268" height="55" rx="15" fill="#ffffff" opacity=".16"/>
    <text x="800" y="565" text-anchor="middle" font-size="13" font-weight="700">Conflict detection &amp; quality constraints</text>
    <text x="800" y="647" text-anchor="middle" font-size="13" opacity=".82">Short prompt → executable visual specification</text>
  </g>

  <!-- Structured prompt output -->
  <g class="cn">
    <rect x="1065" y="204" width="112" height="34" rx="17" fill="#fff0d5"/>
    <text x="1121" y="227" text-anchor="middle" font-size="15" font-weight="700" fill="#d27126">OUTPUT 0</text>
    <text x="1065" y="276" class="section">Structured long prompt</text>
    <g font-size="15" font-weight="700">
      <rect x="1065" y="294" width="102" height="35" rx="11" fill="#ffe5df"/><text x="1116" y="317" text-anchor="middle" fill="#bf4f56">Portrait</text>
      <rect x="1178" y="294" width="102" height="35" rx="11" fill="#e3f2ff"/><text x="1229" y="317" text-anchor="middle" fill="#2879ab">Clothing</text>
      <rect x="1065" y="339" width="102" height="35" rx="11" fill="#e7f7e9"/><text x="1116" y="362" text-anchor="middle" fill="#39855a">Scene</text>
      <rect x="1178" y="339" width="102" height="35" rx="11" fill="#eee8ff"/><text x="1229" y="362" text-anchor="middle" fill="#6952aa">Camera</text>
      <rect x="1065" y="384" width="215" height="31" rx="11" fill="#fff0d5"/><text x="1173" y="405" text-anchor="middle" fill="#b97620">Composition</text>
    </g>
  </g>

  <!-- Pose output, expressed as a simple joint skeleton -->
  <g class="cn">
    <rect x="1065" y="484" width="112" height="34" rx="17" fill="#def7f5"/>
    <text x="1121" y="507" text-anchor="middle" font-size="15" font-weight="700" fill="#218582">OUTPUT 1</text>
    <text x="1065" y="550" class="section">Pose</text>
    <rect x="1105" y="560" width="130" height="135" rx="18" fill="#f1fbfa"/>
    <g fill="none" stroke="#218582" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="1170" cy="580" r="14" fill="#fff"/>
      <path d="M1170 594 L1170 634 M1170 608 L1145 624 L1129 651 M1170 608 L1197 620 L1212 594 M1170 634 L1152 672 L1136 687 M1170 634 L1191 668 L1208 687"/>
    </g>
    <g fill="#218582">
      <circle cx="1170" cy="594" r="5"/><circle cx="1170" cy="608" r="5"/><circle cx="1145" cy="624" r="5"/><circle cx="1129" cy="651" r="5"/><circle cx="1197" cy="620" r="5"/><circle cx="1212" cy="594" r="5"/><circle cx="1170" cy="634" r="5"/><circle cx="1152" cy="672" r="5"/><circle cx="1136" cy="687" r="5"/><circle cx="1191" cy="668" r="5"/><circle cx="1208" cy="687" r="5"/>
    </g>
  </g>

  <!-- Final image-generation model -->
  <g filter="url(#shadow)" class="cn">
    <circle cx="1502" cy="398" r="34" fill="#fff" opacity=".95"/>
    <path d="M1487 416 l15 -27 l19 27 z" fill="#f18b55"/>
    <circle cx="1505" cy="389" r="6" fill="#f18b55"/>
    <text x="1502" y="468" text-anchor="middle" font-size="24" font-weight="800" fill="#fff">Chic-Image</text>
    <text x="1502" y="500" text-anchor="middle" font-size="15" fill="#fff" opacity=".94">Text-to-image generation</text>
    <text x="1502" y="529" text-anchor="middle" font-size="14" fill="#fff" opacity=".88">Prompt + pose control</text>
  </g>
</svg>
